<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Song Sparrow Syllable Atlas</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="style.css" />
<script src="vendor/plotly.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.plot.ly/plotly-2.35.2.min.js';document.head.appendChild(s)"></script>
</head>
<body>
<header class="bar">
  <div class="row">
    <h1>Song Sparrow Syllable Atlas</h1>
    <nav class="nav">
      <button class="tab on" data-page="atlas">Atlas</button>
      <button class="tab" data-page="glossary">Glossary</button>
    </nav>
    <span id="status" class="label-caps">loading…</span>
    <div class="spacer"></div>
    <span class="label-caps">Hover</span>
    <button class="tab on" data-hover="syllable" title="show the hovered syllable's spectrogram">syllable</button>
    <button class="tab" data-hover="bout" title="show the whole song and the path through its syllables">bout path</button>
    <span class="label-caps" style="margin-left:10px">Play</span>
    <button class="tab on" data-play="off">off</button>
    <button class="tab" data-play="syllable" title="play the hovered syllable">syllable</button>
    <button class="tab" data-play="song" title="play the whole song the hovered syllable belongs to">whole song</button>
  </div>
  <div class="row">
    <label>X <select id="x"></select></label>
    <label>Y <select id="y"></select></label>
    <label>Z <select id="z"></select></label>
    <label>Color <select id="color"></select></label>
    <button id="umapbtn" class="tab" title="set X/Y to the UMAP projection of the acoustic features">UMAP view</button>
    <button id="pcabtn" class="tab" title="PCA of the same standardized acoustic features, computed on the currently filtered syllables">PCA view</button>
    <button id="pca3d" class="tab" hidden title="add PC3 on the Z axis">PC1–3</button>
    <button id="pcafeat" class="tab" hidden title="choose which features go into the PCA">features…</button>
    <label class="chk" title="log-scale X"><input type="checkbox" id="logx" /> log X</label>
    <label class="chk" title="log-scale Y"><input type="checkbox" id="logy" /> log Y</label>
  </div>
  <div class="row" id="filters">
    <label>Region <select id="f_region" multiple size="1"></select></label>
    <label>Era <select id="f_era" multiple size="1"></select></label>
    <label>Source <select id="f_source" multiple size="1"></select></label>
    <label class="chk"><input type="checkbox" id="f_final" checked /> only bouts in the 2022 analysis</label>
    <label class="chk"><input type="checkbox" id="f_qa" checked /> hide QA-flagged bouts</label>
    <input id="expr" class="input mono" placeholder="filter expression, e.g. duration_ms > 100 && region == 'Drought'  (Enter)" />
    <button id="clear" class="ghost">clear</button>
  </div>
</header>

<div id="umapnote" class="note" hidden></div>
<main>
  <div id="plotwrap"><div id="plot"></div><svg id="pathsvg"></svg></div>
  <aside id="loadings" hidden>
    <div id="pcapanel" hidden>
      <div class="phead"><span class="label-caps">PCA inputs</span><span id="pcacount" class="label-caps"></span></div>
      <div class="pbtns"><button id="pcareset" class="ghost">reset to UMAP set</button><button id="pcaall" class="ghost">all</button><button id="pcanone" class="ghost">none</button></div>
      <div class="phint">Tick a feature to include it; tick <b>log</b> to log10-transform it first (for heavy-tailed measures). Every input is then z-scored. Syllables missing any chosen value are left out.</div>
      <div id="pcalist"></div>
    </div>
    <div class="label-caps" style="padding:8px 8px 0">Feature loadings</div><div id="loadplot"></div>
  </aside>
  <section id="glossary" hidden></section>
  <aside id="detail" hidden>
    <div class="dhead"><span id="dname" class="mono"></span><button id="dclose" class="ghost">✕</button></div>
    <canvas id="dcanvas"></canvas>
    <div class="dbtns">
      <button id="dplaysyll" class="ghost">▶ syllable</button>
      <button id="dplaysong" class="ghost">▶ whole song</button>
      <button id="dstop" class="ghost">■</button>
      <span id="dqa" class="label-caps"></span>
    </div>
    <table id="dtable"></table>
  </aside>
</main>

<div id="overlay" hidden>
  <div class="arrow"></div>
  <div class="card">
    <canvas id="ocanvas"></canvas>
    <div id="oname" class="mono"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
